[package]
name = "wargames-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A terminal UI for playing wargames such as OverTheWire Bandit and UnderTheWire with an embedded SSH session"
repository = "https://github.com/world-class-engineers/wargames-tui"
homepage = "https://github.com/world-class-engineers/wargames-tui"
readme = "README.md"
keywords = ["tui", "terminal", "ssh", "wargame", "ratatui"]
categories = ["command-line-utilities", "games"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE*",
    "wargames.toml",
    "src/**",
    "tests/**",
]

[lints.cargo]
# Both URLs are intentional package metadata for crates.io.
redundant_homepage = "allow"

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["bracketed-paste", "osc52"] }
dirs = "6"
ego-tree = "0.11"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "1"
vt100 = "0.18"

[dev-dependencies]
tempfile = "3"
