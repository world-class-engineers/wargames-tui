[package]
name = "bandit-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for playing OverTheWire Bandit with an embedded SSH session"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = { version = "0.29", features = ["bracketed-paste"] }
dirs = "6"
ego-tree = "0.11"
libc = "0.2"
portable-pty = "0.9"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
vt100 = "0.18"

[dev-dependencies]
tempfile = "3"
