# Default wargame catalog for wargames-tui.
#
# This file is seeded into the user config directory on first run. Once seeded,
# the user's copy is authoritative: edits here after seeding have no effect
# unless the user replaces their config file manually.

version = 1

[[wargames]]
id = "bandit"
name = "OverTheWire Bandit"
homepage = "https://overthewire.org/wargames/bandit/"
ssh_host = "bandit.labs.overthewire.org"
ssh_port = 2220
username_template = "bandit{level}"
level_label = "bandit{level}"
first_level = 0
final_level = 33
page_offset = 1
allowed_secret_kinds = ["password", "private_key_path"]
initial_secret = { kind = "password", value = "bandit0" }
verification_remote_command = "true"
completion_message = "Bandit 33 is the final level — game complete."

[wargames.source]
kind = "html"
url_template = "https://overthewire.org/wargames/bandit/bandit{page}.html"
cache_version = 1

[wargames.source.selectors]
content = "main#content"
heading = "h2"
goal = "level-goal"
commands = "commands"
reading = "reading"
text_tags = ["p", "ul", "ol", "pre", "div"]

[wargames.source.validation]
kind = "script_call"
selector = "main#content script"
marker = "renderLevelTitle"
game_token = "bandit"
expected = "page"

